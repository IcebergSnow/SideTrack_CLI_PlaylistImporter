[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "playlistimporter"
version = "0.1.4"
description = "Create private YouTube playlists from a song link or SideTrack CSV files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
  "ytmusicapi==1.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
playlist-importer = "playlist_importer.cli:main"
sidetrack-import = "playlist_importer.cli:main"
sidetrack = "playlist_importer.cli:main"

[project.urls]
Repository = "https://github.com/IcebergSnow/SideTrack_CLI_PlaylistImporter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
